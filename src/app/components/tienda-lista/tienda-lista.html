<div class="container-fluid px-4 mt-4">
  <!-- Card principal -->
  <div class="card tienda-card shadow-sm border-0 rounded-4">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="card-title mb-0 text-dark fw-semibold">Listado de Tiendas</h5>
        <span class="badge bg-info text-dark px-3 py-2 shadow-sm">
          Total tiendas: {{ tiendasFiltradas.length }}
        </span>
      </div>

      <!-- Buscador -->
      <div class="input-group mb-3 shadow-sm rounded-4 overflow-hidden">
        <input
          type="text"
          class="form-control border-0"
          placeholder="Buscar por código o nombre..."
          [(ngModel)]="filtro"
          (input)="filtrarTiendas()"
        />
        <button class="btn btn-primary">
          <i class="bi bi-search"></i>
          Buscar
        </button>
      </div>

      <!-- Tabla -->
      <div class="table-responsive">
        <table class="table align-middle table-hover">
          <thead class="table-light">
            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let tienda of tiendasFiltradas">
              <td>{{ tienda.codigo }}</td>
              <td>{{ tienda.nombre }}</td>
              <td>
                <span
                  class="badge px-3 py-2"
                  [ngClass]="{
                    'bg-success-subtle text-success': tienda.estado?.toLowerCase() === 'activa',
                    'bg-secondary-subtle text-secondary': tienda.estado?.toLowerCase() !== 'activa'
                  }"
                >
                  {{ tienda.estado || '—' }}
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Sin datos -->
      <div *ngIf="tiendasFiltradas.length === 0" class="text-center text-muted mt-3">
        No hay tiendas disponibles.
      </div>
    </div>
  </div>
</div>
