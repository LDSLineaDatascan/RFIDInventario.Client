<div class="login-container">
  <div class="login-card">
    <h1 class="welcome-text">Bienvenido a RFID Inventory</h1>
    <p class="subtitle">Inicia sesión con tu cuenta corporativa</p>

    <div class="btn-container">
      <button class="btn btn-google" (click)="login()">
        <img src="https://img.icons8.com/color/24/000000/google-logo.png" alt="Google" />
        Continuar con Google
      </button>

      <button class="btn btn-microsoft" (click)="login()">
        <img src="https://img.icons8.com/color/24/000000/microsoft.png" alt="Microsoft" />
        Continuar con Microsoft
      </button>
    </div>
  </div>
</div>
