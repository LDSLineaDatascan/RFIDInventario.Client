<h2>Lista de Tags</h2>

<table>
  <thead>
    <tr>
      <th>ID Tienda</th>
      <th>TAG</th>
      <th>EAN</th>
      <th>Fecha</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let tag of tags">
      <td>{{ tag.idTienda }}</td>
      <td>{{ tag.tag }}</td>
      <td>{{ tag.ean }}</td>
      <td>{{ tag.fecha | date: 'short' }}</td>
    </tr>
  </tbody>
</table>

<div *ngIf="error" style="color: red;">
  {{ error }}
</div>
